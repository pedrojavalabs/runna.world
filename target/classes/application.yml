server:
  port: 10000
  address: 0.0.0.0
spring:
  datasource:
    url: jdbc:h2:mem:strava
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info