server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:h2:mem:strava
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      # Needed so you can access H2 console on Render
  # Add Actuator for health check (optional but recommended)
management:
  endpoints:
    web:
      exposure:
        include: health,info